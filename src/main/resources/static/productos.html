<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vikings - Productos</title>
</head>
<body>
<h1>Productos Vikings</h1>

<p>
    Hola, <span id="nombre-cliente"></span>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
</p>

<h2>Agregar producto</h2>
<input type="text" id="producto" placeholder="Producto">
<input type="text" id="marca" placeholder="Marca">
<input type="text" id="talla" placeholder="Talla">
<input type="text" id="color" placeholder="Color">
<input type="number" id="precio" placeholder="Precio">
<input type="number" id="categoriaId" placeholder="ID de categoría">
<button onclick="guardarProducto()">Guardar</button>
<p id="mensaje"></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Producto</th>
        <th>Marca</th>
        <th>Talla</th>
        <th>Color</th>
        <th>Precio</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody id="tabla-productos"></tbody>
</table>

<script>
    const clienteNombre = sessionStorage.getItem("clienteNombre");

    if (clienteNombre === null) {
        window.location.href = "login.html";
    }

    document.getElementById("nombre-cliente").textContent = clienteNombre;

    let idEditando = null;

    async function cargarProductos() {
        const respuesta = await fetch("/api/productos");
        const productos = await respuesta.json();

        const cuerpoTabla = document.getElementById("tabla-productos");
        cuerpoTabla.innerHTML = "";

        for (const p of productos) {
            cuerpoTabla.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.producto}</td>
            <td>${p.marca}</td>
            <td>${p.talla}</td>
            <td>${p.color}</td>
            <td>${p.precio}</td>
            <td>
              <button onclick="editarProducto(${p.id})">Editar</button>
              <button onclick="eliminarProducto(${p.id})">Eliminar</button>
            </td>
          </tr>`;
        }
    }

    async function guardarProducto() {
        const datos = {
            producto: document.getElementById("producto").value,
            marca: document.getElementById("marca").value,
            talla: document.getElementById("talla").value,
            color: document.getElementById("color").value,
            precio: parseFloat(document.getElementById("precio").value),
            categoria: { id: parseInt(document.getElementById("categoriaId").value) }
        };

        let url = "/api/productos";
        let metodo = "POST";

        if (idEditando !== null) {
            url = "/api/productos/" + idEditando;
            metodo = "PUT";
        }

        const respuesta = await fetch(url, {
            method: metodo,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
        });

        const mensaje = document.getElementById("mensaje");
        if (respuesta.ok) {
            if (metodo === "PUT") {
                mensaje.textContent = "Producto actualizado correctamente";
            } else {
                mensaje.textContent = "Producto guardado correctamente";
            }
            limpiarFormulario();
            cargarProductos();
        } else {
            const error = await respuesta.json();
            let texto = error.mensaje || "No se pudo guardar (código " + respuesta.status + ")";

            if (error.errores) {
                texto = Object.values(error.errores).join(". ");
            }

            mensaje.textContent = texto;
        }
    }

    function limpiarFormulario() {
        document.getElementById("producto").value = "";
        document.getElementById("marca").value = "";
        document.getElementById("talla").value = "";
        document.getElementById("color").value = "";
        document.getElementById("precio").value = "";
        document.getElementById("categoriaId").value = "";
        idEditando = null;
    }

    async function eliminarProducto(id) {
        if (!confirm("¿Seguro que quieres eliminar el producto " + id + "?")) {
            return;
        }

        const respuesta = await fetch("/api/productos/" + id, {
            method: "DELETE"
        });

        const mensaje = document.getElementById("mensaje");
        if (respuesta.ok) {
            mensaje.textContent = "Producto eliminado correctamente";
            cargarProductos();
        } else {
            mensaje.textContent = "No se pudo eliminar (código " + respuesta.status + ")";
        }
    }

    async function editarProducto(id) {
        const respuesta = await fetch("/api/productos/" + id);
        const p = await respuesta.json();

        document.getElementById("producto").value = p.producto;
        document.getElementById("marca").value = p.marca;
        document.getElementById("talla").value = p.talla;
        document.getElementById("color").value = p.color;
        document.getElementById("precio").value = p.precio;
        document.getElementById("categoriaId").value = p.categoria ? p.categoria.id : "";

        idEditando = id;
        document.getElementById("mensaje").textContent = "Editando el producto " + id;
    }

    function cerrarSesion() {
        sessionStorage.removeItem("clienteNombre");
        window.location.href = "login.html";
    }

    cargarProductos();
</script>
</body>
</html>
