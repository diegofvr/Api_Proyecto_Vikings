<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vikings - Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<main class="login">
    <section class="login-foto">
        <img src="img/login/login-portada.png" alt="Jugadores con medias y guayos de la marca Vikings">
    </section>

    <section class="login-formulario">
        <h1>Inicio de sesión</h1>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo">

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena">

        <button onclick="iniciarSesion()">Iniciar sesión</button>
        <p id="mensaje"></p>
    </section>
</main>

<script>
    async function iniciarSesion() {
        const datos = {
            correo: document.getElementById("correo").value,
            contrasena: document.getElementById("contrasena").value
        };

        const respuesta = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
        });

        const mensaje = document.getElementById("mensaje");

        if (respuesta.ok) {
            const resultado = await respuesta.json();
            sessionStorage.setItem("clienteNombre", resultado.cliente.nombre);
            window.location.href = "tienda.html";
        } else {
            const error = await respuesta.json();
            let texto = error.mensaje || "No se pudo iniciar sesión (código " + respuesta.status + ")";

            if (error.errores) {
                texto = Object.values(error.errores).join(". ");
            }

            mensaje.textContent = texto;
        }
    }
</script>
</body>
</html>
